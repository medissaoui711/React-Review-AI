name: Security and Supply Chain

on:
  push:
    branches:
      - main
      - phase-3.7-production-hardening
      - phase-3.8-frontend-integration-readiness
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review introduced dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  supply-chain:
    name: npm audit, SBOM, and license inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit the complete dependency tree
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm sbom --sbom-format=cyclonedx > artifacts/sbom.cdx.json
          node scripts/generate-license-inventory.mjs
      - name: Upload SBOM and license inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-review-ai-supply-chain-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
