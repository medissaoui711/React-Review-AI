name: Security and Supply Chain

on:
  push:
    branches:
      - main
      - phase-3.7-production-hardening
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (\${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: \${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:\${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review introduced dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  supply-chain:
    name: npm audit, SBOM, and license inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit the complete dependency tree
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm sbom --sbom-format=cyclonedx > artifacts/sbom.cdx.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = Object.entries(lock.packages || {})
            .filter(([path]) => path.startsWith('node_modules/'))
            .map(([path, item]) => ({
              package: item.name || path.slice('node_modules/'.length),
              version: item.version || null,
              license: item.license || 'UNKNOWN',
              path
            }))
            .sort((a, b) => a.package.localeCompare(b.package) || String(a.version).localeCompare(String(b.version)));
          const inventory = {
            generated_at: new Date().toISOString(),
            source: 'package-lock.json',
            package_count: packages.length,
            unknown_license_count: packages.filter(item => item.license === 'UNKNOWN').length,
            packages
          };
          fs.writeFileSync('artifacts/license-inventory.json', JSON.stringify(inventory, null, 2) + '\n');
          console.log(\`Inventoried \${packages.length} locked packages; \${inventory.unknown_license_count} have no declared license metadata.\`);
          NODE
      - name: Upload SBOM and license inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: react-review-ai-supply-chain-\${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
