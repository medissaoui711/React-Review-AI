name: React Review AI MCP CI

on:
  push:
    branches: [main, phase-3.2-secure-file-access, phase-3.3-streamable-http, phase-3.4-advanced-review-engine, phase-3.5-authentication-privacy, phase-3.6-compatibility-chatgpt-validation, phase-3.7-production-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-stdio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap source tree from verified archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode react-review-ai-source-0.3.0.tar.gz.base64 > /tmp/react-review-ai.outer.gz
          gzip --decompress --stdout /tmp/react-review-ai.outer.gz > /tmp/react-review-ai.tar.gz
          tar -tzf /tmp/react-review-ai.tar.gz
          mkdir -p /tmp/react-review-ai
          tar -xzf /tmp/react-review-ai.tar.gz -C /tmp/react-review-ai
          ARCHIVE_ROOT="$(find /tmp/react-review-ai -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ ! -f "$GITHUB_WORKSPACE/package.json" ]; then
            cp -a "$ARCHIVE_ROOT"/. "$GITHUB_WORKSPACE"/
            cat > "$GITHUB_WORKSPACE/README.md" <<'EOF'
          # React Review AI

          Read-only React code review MCP server and ChatGPT plugin source.

          ## Requirements
          - Node.js 22+
          - npm

          ## Install and run
          Set REACT_REVIEW_ROOT to the absolute path of the React project to review, then run:
          ```bash
          npm ci
          REACT_REVIEW_ROOT=/absolute/path/to/project npm start
          ```

          ## MCP tools
          - `review_project`
          - `review_component`
          - `run_test_audit`
          - `audit_accessibility`

          The project root is trusted server configuration, not a tool argument. The server performs static, read-only analysis and does not execute project code or tests.
          EOF
          fi
          PACKAGE_DIR="$GITHUB_WORKSPACE"
          SERVER_ENTRY="$PACKAGE_DIR/server/index.mjs"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$SERVER_ENTRY"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "server_entry=$SERVER_ENTRY" >> "$GITHUB_OUTPUT"
          echo "Canonical source root: $PACKAGE_DIR"
          cat "$PACKAGE_DIR/package.json"
      - name: Install production dependencies and MCP test client
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @modelcontextprotocol/client@2.4.0
          npm ls --depth=0
      - name: Syntax-check server modules
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: |
          find server -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
      - name: Run security and regression tests
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: npm test

      - name: MCP stdio server/discover and tools/list integration test
        working-directory: ${{ steps.source.outputs.package_dir }}
        env:
          MCP_SERVER_ENTRY: ${{ steps.source.outputs.server_entry }}
          REACT_REVIEW_ROOT: ${{ github.workspace }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from '@modelcontextprotocol/client';
          import { StdioClientTransport } from '@modelcontextprotocol/client/stdio';

          const expected = [
            'audit_accessibility',
            'review_component',
            'review_project',
            'run_test_audit',
          ];
          const expectedProperties = {
            audit_accessibility: [],
            review_component: ['file_path'],
            review_project: [],
            run_test_audit: [],
          };

          const transport = new StdioClientTransport({
            command: process.execPath,
            args: [process.env.MCP_SERVER_ENTRY],
            env: { ...process.env, REACT_REVIEW_ROOT: process.env.REACT_REVIEW_ROOT },
          });
          const client = new Client(
            { name: 'react-review-ai-ci', version: '1.0.0' },
            { versionNegotiation: { mode: 'auto' } },
          );

          try {
            await client.connect(transport);
            assert.equal(client.getProtocolEra(), 'modern', 'MCP server must negotiate the modern protocol era');
            const result = await client.listTools();
            const actual = result.tools.map((tool) => tool.name).sort();
            assert.deepEqual(actual, expected, 'MCP tools/list must expose all four stable tools');
            for (const tool of result.tools) {
              assert.ok(tool.inputSchema && typeof tool.inputSchema === 'object',
                `Tool ${tool.name} must publish an input schema`);
              assert.ok(tool.outputSchema && typeof tool.outputSchema === 'object',
                `Tool ${tool.name} must publish a dedicated output schema`);
              const properties = Object.keys(tool.inputSchema.properties || {}).sort();
              assert.deepEqual(properties, expectedProperties[tool.name],
                `Tool ${tool.name} must not expose a caller-controlled project root`);
            }
            console.log('TOOL_SCHEMAS=' + JSON.stringify(result.tools.map(({ name, inputSchema }) => ({ name, inputSchema }))));
            console.log('MCP server/discover: PASS');
            console.log('MCP tools/list: PASS');
            console.log(`Registered tools: ${actual.join(', ')}`);

            const smokeCalls = [
              ['review_project', {}],
              ['review_component', { file_path: 'server/index.mjs' }],
              ['run_test_audit', {}],
              ['audit_accessibility', {}],
            ];
            for (const [name, args] of smokeCalls) {
              const call = await client.callTool({ name, arguments: args });
              assert.notEqual(call.isError, true, `MCP tool call failed: ${name}`);
              assert.ok(
                (Array.isArray(call.content) && call.content.length > 0) || call.structuredContent,
                `MCP tool ${name} must return content or structuredContent`,
              );
              console.log(`MCP tools/call ${name}: PASS`);
            }
            const attemptedOverride = await client.callTool({
              name: 'review_project',
              arguments: { project_root: '/tmp' },
            });
            assert.equal(attemptedOverride.isError, true,
              'Tool callers must not be able to override the configured project root');
            console.log('MCP project-root override rejection: PASS');
          } finally {
            await client.close();
          }
          NODE

      - name: MCP Streamable HTTP server/discover, tools/list, and tools/call integration test
        working-directory: ${{ steps.source.outputs.package_dir }}
        env:
          MCP_SERVER_ENTRY: ${{ steps.source.outputs.package_dir }}/server/http.mjs
          REACT_REVIEW_ROOT: ${{ github.workspace }}
          PORT: 43127
        run: |
          set -euo pipefail
          node "$MCP_SERVER_ENTRY" >/tmp/react-review-ai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/mcp || true)"
            if [ "$STATUS" = "405" ]; then break; fi
            sleep 0.25
          done
          test "${STATUS:-}" = "405"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client, StreamableHTTPClientTransport } from '@modelcontextprotocol/client';

          const expected = [
            'audit_accessibility',
            'review_component',
            'review_project',
            'run_test_audit',
          ];
          const transport = new StreamableHTTPClientTransport(
            new URL('http://127.0.0.1:43127/mcp'),
          );
          const client = new Client(
            { name: 'react-review-ai-http-ci', version: '1.0.0' },
            { versionNegotiation: { mode: 'auto' } },
          );

          try {
            await client.connect(transport);
            assert.equal(client.getProtocolEra(), 'modern', 'MCP HTTP server must negotiate the modern protocol era');
            const result = await client.listTools();
            assert.deepEqual(result.tools.map((tool) => tool.name).sort(), expected);
            for (const tool of result.tools) {
              assert.ok(tool.outputSchema && typeof tool.outputSchema === 'object',
                `HTTP tool ${tool.name} must publish a dedicated output schema`);
              const properties = Object.keys(tool.inputSchema.properties || {}).sort();
              assert.deepEqual(properties, tool.name === 'review_component' ? ['file_path'] : []);
            }
            for (const [name, args] of [
              ['review_project', {}],
              ['review_component', { file_path: 'server/index.mjs' }],
              ['run_test_audit', {}],
              ['audit_accessibility', {}],
            ]) {
              const call = await client.callTool({ name, arguments: args });
              assert.notEqual(call.isError, true, `HTTP MCP tool call failed: ${name}`);
              assert.ok((call.content?.length || 0) > 0 || call.structuredContent);
              console.log(`HTTP tools/call ${name}: PASS`);
            }
            console.log('MCP Streamable HTTP server/discover: PASS');
            console.log('MCP Streamable HTTP tools/list: PASS');
          } finally {
            await client.close();
          }
          NODE
          cat /tmp/react-review-ai-http.log

  publish-generated-files:
    needs: mcp-stdio-smoke
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated source and lock files to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex-plugin .gitignore server skills tests mcp.json plugin.json package.json package-lock.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish source tree and lock npm dependencies"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Source tree and lockfile are already up to date."
          fi
