name: React Review AI MCP CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mcp-stdio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap source tree from verified archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode react-review-ai-source-0.3.0.tar.gz.base64 > /tmp/react-review-ai.outer.gz
          gzip --decompress --stdout /tmp/react-review-ai.outer.gz > /tmp/react-review-ai.tar.gz
          tar -tzf /tmp/react-review-ai.tar.gz
          mkdir -p /tmp/react-review-ai
          tar -xzf /tmp/react-review-ai.tar.gz -C /tmp/react-review-ai
          ARCHIVE_ROOT="$(find /tmp/react-review-ai -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ ! -f "$GITHUB_WORKSPACE/package.json" ]; then
            cp -a "$ARCHIVE_ROOT"/. "$GITHUB_WORKSPACE"/
            cat > "$GITHUB_WORKSPACE/README.md" <<'EOF'
          # React Review AI

          Read-only React code review MCP server and ChatGPT plugin source.

          ## Requirements
          - Node.js 22+
          - npm

          ## Install and run
          ```bash
          npm ci
          npm start
          ```

          ## MCP tools
          - `review_project`
          - `review_component`
          - `run_test_audit`
          - `audit_accessibility`

          ## Skills
          - React code review
          - React testing
          - Accessibility audit (WCAG 2.2)

          The server performs static, read-only analysis. It does not modify project files or execute the user's project tests.

          ## Validation
          GitHub Actions installs the locked dependencies, syntax-checks server modules, negotiates MCP over stdio, lists all tools, and calls each registered tool.
          EOF
          fi
          PACKAGE_DIR="$GITHUB_WORKSPACE"
          SERVER_ENTRY="$PACKAGE_DIR/server/index.mjs"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$SERVER_ENTRY"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "server_entry=$SERVER_ENTRY" >> "$GITHUB_OUTPUT"
          echo "Canonical source root: $PACKAGE_DIR"
          cat "$PACKAGE_DIR/package.json"
      - name: Install production dependencies and MCP test client
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @modelcontextprotocol/client@2.4.0
          npm ls --depth=0
      - name: Syntax-check server modules
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: |
          find server -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
      - name: Run security and regression tests
        working-directory: ${{ steps.source.outputs.package_dir }}
        run: npm test

      - name: MCP stdio initialize and tools/list integration test
        working-directory: ${{ steps.source.outputs.package_dir }}
        env:
          MCP_SERVER_ENTRY: ${{ steps.source.outputs.server_entry }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from '@modelcontextprotocol/client';
          import { StdioClientTransport } from '@modelcontextprotocol/client/stdio';

          const expected = [
            'audit_accessibility',
            'review_component',
            'review_project',
            'run_test_audit',
          ];

          const transport = new StdioClientTransport({
            command: process.execPath,
            args: [process.env.MCP_SERVER_ENTRY],
          });
          const client = new Client(
            { name: 'react-review-ai-ci', version: '1.0.0' },
            { versionNegotiation: { mode: 'auto' } },
          );

          try {
            await client.connect(transport);
            const result = await client.listTools();
            const actual = result.tools.map((tool) => tool.name).sort();
            assert.deepEqual(actual, expected, 'MCP tools/list must expose all four stable tools');
            for (const tool of result.tools) {
              assert.ok(tool.inputSchema && typeof tool.inputSchema === 'object',
                `Tool ${tool.name} must publish an input schema`);
            }
            console.log('TOOL_SCHEMAS=' + JSON.stringify(result.tools.map(({ name, inputSchema }) => ({ name, inputSchema }))));
            console.log('MCP initialize: PASS');
            console.log('MCP tools/list: PASS');
            console.log(`Registered tools: ${actual.join(', ')}`);

            const smokeCalls = [
              ['review_project', {}],
              ['review_component', { file_path: 'server/index.mjs' }],
              ['run_test_audit', {}],
              ['audit_accessibility', {}],
            ];
            for (const [name, args] of smokeCalls) {
              const call = await client.callTool({ name, arguments: args });
              assert.notEqual(call.isError, true, `MCP tool call failed: ${name}`);
              assert.ok(
                (Array.isArray(call.content) && call.content.length > 0) || call.structuredContent,
                `MCP tool ${name} must return content or structuredContent`,
              );
              console.log(`MCP tools/call ${name}: PASS`);
            }
          } finally {
            await client.close();
          }
          NODE

      - name: Commit source tree and reproducible dependency lock
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex-plugin .gitignore server skills tests mcp.json plugin.json package.json package-lock.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish source tree and lock npm dependencies"
            git push origin HEAD:main
          else
            echo "Source tree and lockfile are already up to date."
          fi
